[versions]
agp = "9.4.1"
kotlin = "2.4.20"
coreKtx = "1.19.1"
material3Android = "1.5.0-alpha29"
navigation3Ui = "1.2.0"
materialVersion = "1.14.0"
materialIconsExtendedAndroid = "1.7.8"
jsoup = "1.23.2"
browser = "1.10.0"
mapsCompose = "8.6.0"
accompanistPermissions = "0.37.3"
retrofit = "3.0.0"
moshiKotlin = "1.15.2"
lifecycleViewmodelNavigation3 = "2.11.0"
converterMoshi = "3.0.0"
